name: Liteshot

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6

options:
  bundleIdPrefix: com.redcarl
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Liteshot:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Liteshot
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        SUFeedURL: "https://example.com/liteshot/appcast.xml"
        SUPublicEDKey: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        SUEnableAutomaticChecks: false
        SUAllowsAutomaticUpdates: false
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redcarl.Liteshot
        PRODUCT_NAME: Liteshot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Sparkle
    scheme:
      gatherCoverageData: false
      testTargets: []
