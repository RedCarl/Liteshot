<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Liteshot — 轻量的 macOS 截图与标注工具</title>
<meta name="description" content="Liteshot 是一个菜单栏常驻的原生 macOS 截图工具：区域/窗口/滚动截图、内联标注、OCR、贴图。Swift + AppKit，开源 MIT。" />
<meta name="theme-color" content="#0e0f10" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
<link rel="icon" href="assets/icon.png" type="image/png" />
<link rel="canonical" href="https://redcarl.github.io/Liteshot/" />

<meta property="og:type" content="website" />
<meta property="og:url" content="https://redcarl.github.io/Liteshot/" />
<meta property="og:title" content="Liteshot — 轻量的 macOS 截图与标注工具" />
<meta property="og:description" content="框选、标注、复制、保存，都在一个覆盖层里完成。" />
<meta property="og:image" content="https://redcarl.github.io/Liteshot/assets/screenshot.jpg" />

<style>
:root {
  --bg: #0e0f10;
  --fg: #f3f4f5;
  --muted: #a4a6ab;
  --faint: #7b7e84;
  --line: rgba(255, 255, 255, 0.11);
  --line-soft: rgba(255, 255, 255, 0.06);
  --panel: rgba(255, 255, 255, 0.04);
  --panel-hi: rgba(255, 255, 255, 0.07);
  --brand: #79a9ff;
  --brand-ink: #06152e;
  --brand-soft: rgba(121, 169, 255, 0.13);
  --brand-line: rgba(121, 169, 255, 0.30);
  --radius: 16px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f6f7;
    --fg: #16171a;
    --muted: #5b5d63;
    --faint: #86888e;
    --line: rgba(0, 0, 0, 0.12);
    --line-soft: rgba(0, 0, 0, 0.07);
    --panel: #ffffff;
    --panel-hi: #fbfbfc;
    --brand: #0d8f6b;
    --brand-ink: #ffffff;
    --brand-soft: rgba(13, 143, 107, 0.09);
    --brand-line: rgba(13, 143, 107, 0.30);
    color-scheme: light;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  /* 一层很淡的方向光，避免整页死灰 */
  background-image:
    radial-gradient(1000px 620px at 12% -10%, rgba(121, 169, 255, 0.13), transparent 62%),
    radial-gradient(820px 520px at 96% 6%, rgba(96, 165, 250, 0.07), transparent 66%);
  background-repeat: no-repeat;
  background-attachment: fixed;
}

@media (prefers-color-scheme: light) {
  body {
    background-image:
      radial-gradient(1000px 620px at 12% -10%, rgba(10, 108, 255, 0.10), transparent 62%),
      radial-gradient(820px 520px at 96% 6%, rgba(59, 130, 246, 0.07), transparent 66%);
  }
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; height: auto; display: block; }

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 3px;
  border-radius: 8px;
}

.wrap {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ---------- 顶栏 ---------- */

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  height: 76px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.brand img {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: #f3f4f5;
  box-shadow: 0 0 0 1px var(--line);
}

.nav-link {
  font-size: 14px;
  color: var(--muted);
  transition: color 0.18s ease;
}
.nav-link:hover { color: var(--fg); }

/* ---------- 首屏：左文字 / 右预览 ---------- */

.hero {
  display: grid;
  grid-template-columns: 0.92fr 1.08fr;
  align-items: center;
  gap: 52px;
  padding: 40px 0 64px;
}

.eyebrow {
  display: inline-block;
  margin: 0 0 18px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(36px, 4.6vw, 58px);
  line-height: 1.1;
  letter-spacing: -0.035em;
  font-weight: 700;
}

h1 em {
  font-style: normal;
  color: var(--brand);
}

.lede {
  margin: 20px 0 0;
  max-width: 34em;
  font-size: clamp(15px, 1.4vw, 17px);
  line-height: 1.75;
  color: var(--muted);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 30px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  height: 48px;
  padding: 0 24px;
  border-radius: 12px;
  border: 1px solid transparent;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  white-space: nowrap;
  transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}

.btn svg { width: 17px; height: 17px; }

.btn-primary {
  background: var(--brand);
  color: var(--brand-ink);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
}
.btn-primary:hover { transform: translateY(-1px); }

.btn-ghost {
  background: var(--panel);
  border-color: var(--line);
  color: var(--fg);
}
.btn-ghost:hover { background: var(--panel-hi); transform: translateY(-1px); }

/* 预览图 */
.shot {
  position: relative;
  margin: 0;
}

.shot::before {
  content: "";
  position: absolute;
  inset: -28px -20px -36px;
  background: radial-gradient(60% 60% at 50% 40%, var(--brand-soft), transparent 72%);
  filter: blur(22px);
  z-index: 0;
  pointer-events: none;
}

.shot img {
  position: relative;
  z-index: 1;
  width: 100%;
  border-radius: 18px;
  border: 1px solid var(--line);
  box-shadow:
    0 40px 70px -34px rgba(0, 0, 0, 0.85),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}



.hint a {
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}
.hint a:hover { color: var(--fg); }

.hint + .hint { margin-top: 6px; }

.linkbtn {
  border: 0;
  padding: 0;
  background: none;
  font: inherit;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}

.linkbtn:hover { color: var(--fg); }

footer {
  padding: 28px 0 48px;
  font-size: 12px;
  color: var(--faint);
}

footer .row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  border-top: 1px solid var(--line-soft);
  padding-top: 20px;
}

footer a { color: var(--muted); }
footer a:hover { color: var(--fg); }

/* ---------- 响应式 ---------- */

@media (max-width: 940px) {
  .hero {
    grid-template-columns: 1fr;
    gap: 36px;
    padding: 32px 0 56px;
  }
  .shot { order: 2; }
}

@media (max-width: 520px) {
  .wrap { padding: 0 20px; }
  .nav { height: 64px; }
  .actions .btn { flex: 1 1 100%; }
}
</style>
</head>

<body>
<div class="wrap">

  <header class="nav">
    <a class="brand" href="#top">
      <img src="assets/icon.png" width="28" height="28" alt="" />
      Liteshot
    </a>
    <a class="nav-link" href="https://github.com/RedCarl/Liteshot" target="_blank" rel="noopener">GitHub ↗</a>
  </header>

  <main id="top">
    <section class="hero">
      <div class="copy">
        <p class="eyebrow">macOS 14+ · Apple 芯片与 Intel</p>

        <h1>截图，<br />也可以<em>很轻</em>。</h1>

        <p class="lede">
          菜单栏常驻，框选、标注、复制一步到位。
        </p>

        <div class="actions">
          <a class="btn btn-primary" id="hero-dl" href="https://apps.apple.com/cn/app/id6835743767" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            <span id="hero-dl-label">App Store</span>
          </a>
          <a class="btn btn-ghost" href="https://github.com/RedCarl/Liteshot" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
            源代码
          </a>
        </div>

      </div>

      <figure class="shot">
        <img src="assets/screenshot.jpg" width="1200" height="1021"
             alt="Liteshot 截图界面：选区、顶部悬浮模式条与内联工具条" />
      </figure>
    </section>

  </main>

  <footer>
    <div class="row">
      <span>© 2026 Liteshot</span>
      <span><a href="privacy.html">隐私政策</a> · <a href="support.html">支持</a></span>
    </div>
  </footer>

</div>

</body>
</html>
