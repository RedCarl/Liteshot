name: Liteshot

options:
  bundleIdPrefix: cn.carljoy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Liteshot:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Liteshot
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 孙磊"
        NSDownloadsFolderUsageDescription: 贴图窗口「保存到下载」需要写入「下载」文件夹。
        NSDesktopFolderUsageDescription: 将截图保存目录选到「桌面」时需要访问该文件夹。
        NSDocumentsFolderUsageDescription: 将截图保存目录选到「文稿」时需要访问该文件夹。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.carljoy.liteshot
        PRODUCT_NAME: Liteshot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/Liteshot.entitlements
    scheme:
      gatherCoverageData: false
      testTargets: []
