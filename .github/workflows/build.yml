name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Liteshot.xcodeproj \
            -scheme Liteshot \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Self-tests (no screen capture)
        run: |
          APP_DIR=$(xcodebuild -project Liteshot.xcodeproj -scheme Liteshot -showBuildSettings \
            | awk '/ BUILT_PRODUCTS_DIR/ {print $3; exit}')
          BIN="$APP_DIR/Liteshot.app/Contents/MacOS/Liteshot"
          for flag in \
            --selftest-document --selftest-pixel --selftest-shortcut \
            --selftest-scroll --selftest-scrollh --selftest-panorama \
            --selftest-ocr --selftest-history
          do
            echo "== $flag =="
            "$BIN" "$flag"
          done
